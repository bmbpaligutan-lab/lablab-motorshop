<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Reservations</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><div id="shell"></div><script type="module">import {layout} from '../assets/js/layout.js';import {supabase,money,esc} from '../assets/js/app.js';const p=await layout('My Reservations','customer');if(p){const {data:c}=await supabase.from('customers').select('customer_id').eq('user_id',p.id).maybeSingle();const {data}=c?await supabase.from('booking').select('*,branches(branch_name)').eq('customer_id',c.customer_id).order('booking_date',{ascending:false}):{data:[]};document.querySelector('#page').innerHTML='<h3 class="mb-3">My Reservations</h3><div class="card p-3"><table class="table"><thead><tr><th>ID</th><th>Branch</th><th>Total</th><th>Status</th></tr></thead><tbody>'+(data||[]).map(x=>`<tr><td>#${x.booking_id}</td><td>${esc(x.branches?.branch_name)}</td><td>${money(x.total_amount)}</td><td>${esc(x.status)}</td></tr>`).join('')+'</tbody></table></div>';}</script></body></html>
