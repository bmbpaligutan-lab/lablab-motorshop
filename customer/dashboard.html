<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Dashboard</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><div id="shell"></div><script type="module">import {layout} from '../assets/js/layout.js';import {supabase,money,esc} from '../assets/js/app.js';const p=await layout('Dashboard','customer');if(p){const {data}=await supabase.from('parts').select('part_id,part_name,unit_price,is_available').eq('is_available',true).limit(6);document.querySelector('#page').innerHTML=`<div class="row g-3 mb-4"><div class="col-12"><h3>Welcome, ${esc(p.first_name||p.username)}!</h3><p class="text-muted">Browse available motor parts and create reservations.</p></div></div><div class="row g-3">${(data||[]).map(x=>`<div class="col-md-4"><div class="card p-3"><h5>${esc(x.part_name)}</h5><div class="fw-bold">${money(x.unit_price)}</div><a class="btn btn-danger mt-3" href="browse.html">Browse Parts</a></div></div>`).join('')}</div>`}</script></body></html>
