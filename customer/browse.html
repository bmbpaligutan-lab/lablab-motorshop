<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browse Parts</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><div id="shell"></div><script type="module">import {layout} from '../assets/js/layout.js';import {supabase,money,esc} from '../assets/js/app.js';const p=await layout('Browse Parts','customer');if(p){const {data}=await supabase.from('parts').select('part_id,part_name,part_number,description,unit_price,is_available').order('part_name');document.querySelector('#page').innerHTML=`<h3 class="mb-3">Available Parts</h3><div class="row g-3">${(data||[]).map(x=>`<div class="col-md-4"><div class="card part-card p-3"><h5>${esc(x.part_name)}</h5><small class="text-muted">${esc(x.part_number)}</small><p class="small mt-2">${esc(x.description)}</p><div class="fw-bold">${money(x.unit_price)}</div><button class="btn btn-danger mt-3 reserve" data-id="${x.part_id}">Reserve</button></div></div>`).join('')}</div>`;document.querySelectorAll('.reserve').forEach(b=>b.onclick=()=>alert('Reservation cart workflow can be connected after your Supabase branch/customer setup is complete.'))}</script></body></html>
