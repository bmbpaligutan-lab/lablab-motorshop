<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Lablab Motorshop</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="login-wrapper"><div class="card login-card p-4"><div class="text-center mb-3"><h4 class="fw-bold">🏍️ Lablab Motorshop</h4><small class="text-muted">Interbranch Reservation & Inventory System</small></div><div id="msg"></div><form id="login"><label class="form-label">Email</label><input id="email" type="email" class="form-control mb-3" required><label class="form-label">Password</label><input id="password" type="password" class="form-control mb-3" required><button class="btn btn-danger w-100">Log In</button></form><p class="text-center mt-3 mb-0 small">New customer? <a href="register.html">Create an account</a></p></div></div><script type="module">
import { supabase, requireConfig } from '../assets/js/supabase.js';

const form = document.getElementById('login');
const msg = document.getElementById('msg');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const button = form.querySelector('button');

function showMessage(message, type = 'danger') {
    msg.innerHTML = `<div class="alert alert-${type}" role="alert">${message}</div>`;
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.innerHTML = '';

    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;

    if (!email || !password) {
        showMessage('Please enter your email and password.');
        return;
    }

    try {
        requireConfig();
        button.disabled = true;
        button.textContent = 'Signing in...';

        // Sign in through Supabase Authentication.
        const { data: authData, error: authError } =
            await supabase.auth.signInWithPassword({ email, password });

        if (authError) throw authError;
        if (!authData?.user) throw new Error('Login succeeded, but no user session was returned.');

        // Load the user's role from the profile created by the database trigger.
        const { data: profile, error: profileError } = await supabase
            .from('profiles')
            .select('id, username, email, first_name, last_name, role, is_active')
            .eq('id', authData.user.id)
            .maybeSingle();

        if (profileError) throw profileError;

        if (!profile) {
            await supabase.auth.signOut();
            throw new Error('Your account has no profile yet. Run the latest supabase_schema.sql, then sign out and register/login again.');
        }

        if (profile.is_active === false) {
            await supabase.auth.signOut();
            throw new Error('This account is inactive. Please contact the administrator.');
        }

        // Route users according to their database role.
        if (profile.role === 'admin') {
            window.location.replace('../admin/dashboard.html');
        } else if (profile.role === 'staff') {
            window.location.replace('../admin/dashboard.html');
        } else {
            window.location.replace('../customer/dashboard.html');
        }
    } catch (error) {
        console.error('Login error:', error);
        const message = error?.message || 'Unable to log in.';

        if (/invalid api key|apikey/i.test(message)) {
            showMessage('Invalid Supabase API key. Open <strong>assets/js/config.js</strong> and enter your Supabase Project URL and public/publishable key.');
        } else if (/invalid login credentials/i.test(message)) {
            showMessage('Invalid email or password.');
        } else {
            showMessage(message);
        }
    } finally {
        button.disabled = false;
        button.textContent = 'Log In';
    }
});
</script></body></html>
