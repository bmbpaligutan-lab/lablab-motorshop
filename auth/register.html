<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · Lablab Motorshop</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="login-wrapper"><div class="card login-card p-4"><div class="text-center mb-3"><h4 class="fw-bold">🏍️ Customer Registration</h4></div><div id="msg"></div><form id="reg"><input id="first" class="form-control mb-2" placeholder="First name" required><input id="last" class="form-control mb-2" placeholder="Last name" required><input id="username" class="form-control mb-2" placeholder="Username" required><input id="email" type="email" class="form-control mb-2" placeholder="Email" required><input id="password" type="password" minlength="6" class="form-control mb-3" placeholder="Password" required><button class="btn btn-danger w-100">Register</button></form><p class="text-center mt-3 mb-0 small"><a href="login.html">Back to login</a></p></div></div><script type="module">import {supabase,requireConfig} from '../assets/js/supabase.js'; document.querySelector('#reg').onsubmit=async e=>{e.preventDefault();const msg=document.querySelector('#msg');try{requireConfig();const {data,error}=await supabase.auth.signUp({email:email.value.trim(),password:password.value,options:{data:{first_name:first.value.trim(),last_name:last.value.trim(),username:username.value.trim()}}});if(error)throw error;msg.innerHTML='<div class="alert alert-success">Registration successful. If email confirmation is enabled, confirm your email before logging in.</div>';e.target.reset();}catch(x){msg.innerHTML='<div class="alert alert-danger">'+x.message+'</div>';}};</script></body></html>
