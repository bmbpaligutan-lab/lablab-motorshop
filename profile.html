<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head><body><div class="container py-5"><div class="card p-4"><h3>Profile</h3><div id="p">Loading…</div><a class="btn btn-outline-secondary mt-3" href="javascript:history.back()">Back</a></div></div><script type="module">import {profile,esc} from './assets/js/app.js';const p=await profile();document.querySelector('#p').innerHTML=p?`<p><b>Name:</b> ${esc(p.first_name)} ${esc(p.last_name)}</p><p><b>Username:</b> ${esc(p.username)}</p><p><b>Email:</b> ${esc(p.email)}</p><p><b>Role:</b> ${esc(p.role)}</p>`:'Not logged in';</script></body></html>
